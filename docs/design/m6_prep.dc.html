<div style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 12px; color: #6E6E6E; padding: 0 4px">目标</span><section style="border-radius: 20px; border: 1px solid #EFEFEF; overflow: hidden"><a href="m1_school.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 16px; text-decoration: none; color: #1A1A1A"><span style="flex-grow: 1; font-size: 15px">院校与专业</span><span style="font-size: 13px; color: #6E6E6E">海南大学 · 中国语言文学</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6E6E6E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></a><a href="m6_prep.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 16px; border-top: 1px solid #EFEFEF; text-decoration: none; color: #1A1A1A"><span style="flex-grow: 1; font-size: 15px">初试日期</span><span style="font-size: 13px; color: #6E6E6E">12 月下旬（待官方公布）</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6E6E6E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></a></section></div>
<div style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 12px; color: #6E6E6E; padding: 0 4px">备考阶段</span>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; background: #F7F7F5; border-radius: 14px"><sc-for list="{{stages}}" as="s" hint-placeholder-count="2"><button onClick="{{s.pick}}" style="height: 38px; border: none; border-radius: 10px; background: {{s.bg}}; font-family: inherit; font-size: 14px; font-weight: {{s.weight}}; color: #1A1A1A; cursor: pointer">{{s.label}}</button></sc-for></div></div>

<span style="font-size: 12px; line-height: 1.6; color: #6E6E6E">修改后立即生效，从明天起按新设置生成每日计划。更换院校专业会切换知识框架，已有学习记录会保留。</span></main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const self = this;
    const s = this.state || {};
    const stage = s.stage || 'sprint';
    const mins = s.mins || 45;
    return {
      stages: [{ id: 'sprint', l: '冲刺期' }, { id: 'base', l: '基础期' }].map(function (d) {
        return { label: d.l, bg: d.id === stage ? '#FFFFFF' : 'transparent', weight: d.id === stage ? '700' : '400', pick: function () { self.setState({ stage: d.id }); } };
      }),
      mins: [30, 45, 60, 90].map(function (m) {
        return { label: m + ' 分钟', bg: m === mins ? '#1A1A1A' : '#F7F7F5', fg: m === mins ? '#FFFFFF' : '#1A1A1A', pick: function () { self.setState({ mins: m }); } };
      })
    };
  }
}
</script>
