<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const self = this;
    const s = this.state || {};
    const t1 = s.t1 || 'k';
    const t2 = s.t2 || 'w';
    function seg(cur, key) {
      return [{ id: 'k', l: '知识问答类' }, { id: 'w', l: '写作类' }].map(function (d) {
        return {
          label: d.l,
          bg: d.id === cur ? '#FFFFFF' : 'transparent',
          weight: d.id === cur ? '700' : '400',
          pick: function () { const n = {}; n[key] = d.id; self.setState(n); }
        };
      });
    }
    return { seg1: seg(t1, 't1'), seg2: seg(t2, 't2') };
  }
}
</script>
