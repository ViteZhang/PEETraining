<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>1.3 备考设置</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#1A1A1A}a:hover{color:#1A1A1A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; display: flex; flex-direction: column; overflow: hidden; position: relative; font-family: 'Noto Sans SC','PingFang SC',sans-serif; color: #1A1A1A">
<main style="flex-grow: 1; display: flex; flex-direction: column; gap: 18px; padding: 44px 22px 28px; box-sizing: border-box; overflow: hidden">
<div style="display: flex; justify-content: space-between; align-items: center; min-height: 44px"><a href="m1_major.dc.html" aria-label="返回" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; margin-left: -12px; color: #1A1A1A"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a><span style="font-size: 15px; font-weight: 500"></span><span style="width: 44px"></span></div>
<div style="display: flex; flex-direction: column; gap: 8px"><div style="display: flex; gap: 6px"><span style="flex-grow: 1; height: 4px; border-radius: 2px; background: #1A1A1A"></span><span style="flex-grow: 1; height: 4px; border-radius: 2px; background: #1A1A1A"></span><span style="flex-grow: 1; height: 4px; border-radius: 2px; background: #EFEFEF"></span></div><span style="font-size: 12px; color: #6E6E6E">第 2 步 / 共 3 步 · 备考设置</span></div>
<div style="display: flex; flex-direction: column; gap: 8px"><h1 style="margin: 0; font-size: 26px; line-height: 1.35; font-weight: 700">设置你的备考节奏</h1></div>
<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 14px; font-weight: 700">备考阶段</span>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{stages}}" as="s" hint-placeholder-count="2"><button onClick="{{s.pick}}" style="display: flex; flex-direction: column; gap: 4px; align-items: flex-start; padding: 14px 16px; border-radius: 18px; border: 1.5px solid {{s.border}}; background: #FFFFFF; font-family: inherit; text-align: left; cursor: pointer"><span style="font-size: 16px; font-weight: 700; color: #1A1A1A">{{s.title}}</span><span style="font-size: 12px; color: #6E6E6E">{{s.sub}}</span></button></sc-for>
</div>
<span style="font-size: 13px; line-height: 1.6; color: #1D4C77; background: #E5F0FA; padding: 10px 12px; border-radius: 14px">{{hint}}</span>
</div>
<button style="display: flex; justify-content: space-between; align-items: center; width: 100%; min-height: 60px; padding: 0 16px; border-radius: 18px; border: 1px solid #EFEFEF; background: #FFFFFF; font-family: inherit; text-align: left; cursor: pointer">
<span style="display: flex; align-items: center; gap: 12px"><span style="color: #1A1A1A"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"></rect><path d="M4 10h16M9 3v4M15 3v4"></path></svg></span><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; color: #1A1A1A">初试日期</span><span style="font-size: 12px; color: #6E6E6E">默认按官方公布日期，公布后自动更新</span></span></span>
<span style="display: flex; align-items: center; gap: 4px; font-size: 13px; color: #6E6E6E">12 月下旬<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6E6E6E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></span></button>
<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 14px; font-weight: 700">每天大概能学多久？</span>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{durations}}" as="d" hint-placeholder-count="4"><button onClick="{{d.pick}}" style="height: 44px; border-radius: 22px; border: none; background: {{d.bg}}; color: {{d.fg}}; font-family: inherit; font-size: 13px; cursor: pointer">{{d.label}}</button></sc-for>
</div>
<span style="font-size: 12px; color: #6E6E6E">每日推荐训练会按这个时长安排，之后可在「我的 · 备考设置」修改</span>
</div>
<div style="flex-grow: 1"></div>
<a href="m1_diagintro.dc.html" style="display: flex; align-items: center; justify-content: center; height: 50px; border-radius: 25px; background: #1A1A1A; color: #FFFFFF; text-decoration: none; font-size: 15px; font-weight: 500">下一步</a>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const stage = s.stage || 'sprint';
    const mins = s.mins || 45;
    return {
      stages: [
        { id: 'sprint', title: '冲刺期', sub: '参加今年 12 月初试' },
        { id: 'base', title: '基础期', sub: '备考明年初试' }
      ].map((d) => ({
        title: d.title, sub: d.sub,
        border: d.id === stage ? '#1A1A1A' : '#EFEFEF',
        pick: () => this.setState({ stage: d.id })
      })),
      hint: stage === 'sprint' ? '冲刺模式：每日训练以到期复习和薄弱查漏为主，不再推送新知识点。' : '基础模式：按章节推进新知识点，同时根据遗忘规律安排复习。',
      durations: [30, 45, 60, 90].map((m) => ({
        label: m + ' 分钟',
        bg: m === mins ? '#1A1A1A' : '#F7F7F5',
        fg: m === mins ? '#FFFFFF' : '#1A1A1A',
        pick: () => this.setState({ mins: m })
      }))
    };
  }
}
</script>
</body>
</html>
