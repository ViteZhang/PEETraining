<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>1.5 摸底测答题</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#1A1A1A}a:hover{color:#1A1A1A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; display: flex; flex-direction: column; overflow: hidden; position: relative; font-family: 'Noto Sans SC','PingFang SC',sans-serif; color: #1A1A1A">
<main style="flex-grow: 1; display: flex; flex-direction: column; gap: 16px; padding: 44px 22px 28px; box-sizing: border-box; overflow: hidden">
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: center; min-height: 44px"><a href="m1_diagexit.dc.html" aria-label="退出摸底测" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; margin-left: -12px; color: #1A1A1A"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a><span style="font-size: 15px; font-weight: 500">摸底诊断</span><span style="font-family: 'DM Sans',sans-serif; font-size: 13px; color: #6E6E6E; width: 44px; text-align: right">6 / 20</span></div>
<div style="height: 4px; background: #EFEFEF; border-radius: 2px"><div style="width: 30%; height: 4px; background: #1A1A1A; border-radius: 2px"></div></div>
</div>
<div style="display: flex; gap: 8px"><span style="font-size: 12px; font-weight: 500; padding: 4px 10px; border-radius: 999px; white-space: nowrap; background: #F7F7F5; color: #1A1A1A">文学理论</span><span style="font-size: 12px; font-weight: 500; padding: 4px 10px; border-radius: 999px; white-space: nowrap; border: 1px solid #E6E6E6; color: #6E6E6E">单选</span></div>
<h2 style="margin: 0; font-size: 20px; line-height: 1.55; font-weight: 700">下列关于「意境」的表述，最准确的一项是：</h2>
<div style="display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{options}}" as="o" hint-placeholder-count="5"><button onClick="{{o.pick}}" style="display: flex; gap: 12px; align-items: center; width: 100%; padding: 13px 14px; min-height: 52px; border-radius: 16px; border: 1.5px solid {{o.border}}; background: #FFFFFF; font-family: inherit; text-align: left; cursor: pointer"><span style="flex-shrink: 0; width: 26px; height: 26px; border-radius: 13px; background: {{o.dotBg}}; color: {{o.dotFg}}; display: flex; align-items: center; justify-content: center; font-family: 'DM Sans',sans-serif; font-size: 13px; font-weight: 600">{{o.letter}}</span><span style="font-size: 15px; line-height: 1.55; color: #1A1A1A">{{o.text}}</span></button></sc-for>
</div>
<div style="flex-grow: 1"></div>
<div style="display: grid; grid-template-columns: 1fr 1.6fr; gap: 10px">
<button style="height: 50px; border-radius: 25px; border: 1px solid #E6E6E6; background: #FFFFFF; font-family: inherit; font-size: 15px; color: #1A1A1A">上一题</button>
<sc-if value="{{hasPick}}" hint-placeholder-val="{{ false }}"><a href="m1_reportloading.dc.html" style="display: flex; align-items: center; justify-content: center; height: 50px; border-radius: 25px; background: #1A1A1A; color: #FFFFFF; text-decoration: none; font-size: 15px; font-weight: 500">下一题</a></sc-if>
<sc-if value="{{noPick}}" hint-placeholder-val="{{ true }}"><button disabled style="height: 50px; border-radius: 25px; border: none; background: #EFEFEF; color: #9E9E9E; font-family: inherit; font-size: 15px">下一题</button></sc-if>
</div></main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const picked = this.state && this.state.picked;
    const defs = [
      { letter: 'A', text: '意境强调对客观现实的精确摹写' },
      { letter: 'B', text: '意境是情景交融、虚实相生、韵味无穷的诗意空间' },
      { letter: 'C', text: '意境主要出现在叙事性作品之中' },
      { letter: 'D', text: '意境与王国维的「境界」说没有关联' },
      { letter: '?', text: '不确定' }
    ];
    return {
      hasPick: !!picked,
      noPick: !picked,
      options: defs.map((d) => ({
        letter: d.letter, text: d.text,
        border: picked === d.letter ? '#1A1A1A' : '#EFEFEF',
        dotBg: picked === d.letter ? '#1A1A1A' : '#F7F7F5',
        dotFg: picked === d.letter ? '#FFFFFF' : '#1A1A1A',
        pick: () => this.setState({ picked: d.letter })
      }))
    };
  }
}
</script>
</body>
</html>
