<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>1.1 选择院校</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#1A1A1A}a:hover{color:#1A1A1A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; display: flex; flex-direction: column; overflow: hidden; position: relative; font-family: 'Noto Sans SC','PingFang SC',sans-serif; color: #1A1A1A">
<main style="flex-grow: 1; display: flex; flex-direction: column; gap: 12px; padding: 56px 22px 28px; box-sizing: border-box; overflow: hidden">
<span style="font-size: 12px; color: #6E6E6E">第 1 步 · 院校与专业</span>
<div style="display: flex; flex-direction: column; gap: 8px"><h1 style="margin: 0; font-size: 26px; line-height: 1.35; font-weight: 700">你要考哪所学校？</h1><p style="margin: 0; font-size: 14px; line-height: 1.65; color: #6E6E6E">已收录的院校可直接开始；其他院校上传自己的资料，同样能用全部功能</p></div>
<label style="display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 16px; border-radius: 16px; background: #F7F7F5; color: #767676"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4 4"></path></svg><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">搜索院校名称</span><input type="search" placeholder="搜索院校名称" style="flex-grow: 1; border: none; background: transparent; font-family: inherit; font-size: 15px; color: #1A1A1A; outline: none"></label>
<span style="font-size: 12px; color: #6E6E6E">已收录 · 预设知识框架与真题</span>
<button onClick="{{pick}}" style="display: flex; align-items: center; gap: 14px; width: 100%; padding: 14px 16px; border-radius: 20px; border: 1.5px solid {{border}}; background: #FFFFFF; font-family: inherit; text-align: left; cursor: pointer">
<span style="width: 42px; height: 42px; flex-shrink: 0; border-radius: 12px; background: #E5F0FA; color: #1D4C77; display: flex; align-items: center; justify-content: center"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l9-5 9 5-9 5zM7 11.5V16c0 1.5 2.5 3 5 3s5-1.5 5-3v-4.5"></path></svg></span>
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 700; color: #1A1A1A">海南大学</span><span style="font-size: 12px; color: #6E6E6E">中国语言文学 · 已收录</span></span>
<span style="width: 22px; height: 22px; border-radius: 11px; border: 1.5px solid {{checkBorder}}; background: {{checkBg}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
</button>
<span style="font-size: 12px; color: #6E6E6E; margin-top: 4px">其他院校 · 上传资料后生成专属知识库</span>
<section style="border-radius: 20px; border: 1px solid #EFEFEF; overflow: hidden">
<a href="m1_major_custom.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 16px; text-decoration: none; color: #1A1A1A"><span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px">华中师范大学</span><span style="font-size: 12px; color: #6E6E6E">湖北 · 武汉</span></span><span style="font-size: 12px; font-weight: 500; padding: 4px 10px; border-radius: 999px; white-space: nowrap; background: #F7F7F5; color: #6E6E6E">上传资料使用</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6E6E6E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></a><a href="m1_major_custom.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 16px; border-top: 1px solid #EFEFEF; text-decoration: none; color: #1A1A1A"><span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px">南京大学</span><span style="font-size: 12px; color: #6E6E6E">江苏 · 南京</span></span><span style="font-size: 12px; font-weight: 500; padding: 4px 10px; border-radius: 999px; white-space: nowrap; background: #F7F7F5; color: #6E6E6E">上传资料使用</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6E6E6E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></a><a href="m1_major_custom.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 16px; border-top: 1px solid #EFEFEF; text-decoration: none; color: #1A1A1A"><span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px">陕西师范大学</span><span style="font-size: 12px; color: #6E6E6E">陕西 · 西安</span></span><span style="font-size: 12px; font-weight: 500; padding: 4px 10px; border-radius: 999px; white-space: nowrap; background: #F7F7F5; color: #6E6E6E">上传资料使用</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6E6E6E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></a>
</section>
<div style="flex-grow: 1"></div>
<sc-if value="{{picked}}" hint-placeholder-val="{{ false }}"><a href="m1_major.dc.html" style="display: flex; align-items: center; justify-content: center; height: 50px; border-radius: 25px; background: #1A1A1A; color: #FFFFFF; text-decoration: none; font-size: 15px; font-weight: 500">下一步</a></sc-if>
<sc-if value="{{notPicked}}" hint-placeholder-val="{{ true }}"><button disabled style="height: 50px; border-radius: 25px; border: none; background: #EFEFEF; color: #9E9E9E; font-family: inherit; font-size: 15px">下一步</button></sc-if></main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const self = this;
    const picked = !!(this.state && this.state.picked);
    return {
      picked: picked,
      notPicked: !picked,
      pick: function () { self.setState({ picked: !picked }); },
      border: picked ? '#1A1A1A' : '#EFEFEF',
      checkBg: picked ? '#1A1A1A' : 'transparent',
      checkBorder: picked ? '#1A1A1A' : '#BDBDBD'
    };
  }
}
</script>
</body>
</html>
