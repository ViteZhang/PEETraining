<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>0.2 登录页</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#1A1A1A}a:hover{color:#1A1A1A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; display: flex; flex-direction: column; overflow: hidden; position: relative; font-family: 'Noto Sans SC','PingFang SC',sans-serif; color: #1A1A1A">
<main style="flex-grow: 1; display: flex; flex-direction: column; gap: 0px; padding: 56px 22px 30px; box-sizing: border-box; overflow: hidden">
<div style="display: flex; flex-direction: column; gap: 22px; margin-top: 24px">
<span style="width: 56px; height: 56px; border-radius: 18px; background: #1A1A1A; display: flex; align-items: center; justify-content: center; gap: 4px"><span style="width: 7px; height: 7px; border-radius: 4px; background: #6FA8DC"></span><span style="width: 7px; height: 7px; border-radius: 4px; background: #F2956B"></span><span style="width: 7px; height: 7px; border-radius: 4px; background: #8C80E0"></span></span>
<div style="display: flex; flex-direction: column; gap: 8px"><h1 style="margin: 0; font-size: 26px; line-height: 1.35; font-weight: 700">登录刷题精灵</h1><p style="margin: 0; font-size: 14px; line-height: 1.65; color: #6E6E6E">登录后同步你的学习进度和掌握度，换手机也不会丢</p></div>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px; margin-top: 40px">
<span style="font-family: 'DM Sans',sans-serif; font-size: 30px; font-weight: 600; letter-spacing: 1px">138 **** 0000</span>
<span style="font-size: 12px; color: #6E6E6E">中国移动提供认证服务</span>
</div>
<div style="display: flex; flex-direction: column; gap: 4px; margin-top: 20px">
<sc-if value="{{agreed}}" hint-placeholder-val="{{ false }}"><a href="m1_school.dc.html" style="display: flex; align-items: center; justify-content: center; height: 50px; border-radius: 25px; background: #1A1A1A; color: #FFFFFF; text-decoration: none; font-size: 15px; font-weight: 500">本机号码一键登录</a></sc-if>
<sc-if value="{{notAgreed}}" hint-placeholder-val="{{ true }}"><button onClick="{{needAgree}}" style="height: 50px; border-radius: 25px; border: none; background: #1A1A1A; color: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 500; cursor: pointer">本机号码一键登录</button></sc-if>
<a href="m0_phone.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 44px; font-size: 14px; color: #1A1A1A; text-decoration: none">其他手机号登录</a>
</div>
<div style="flex-grow: 1"></div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 16px">
<div style="display: flex; align-items: center; gap: 12px; width: 100%"><span style="flex-grow: 1; height: 1px; background: #EFEFEF"></span><span style="font-size: 12px; color: #767676">其他方式登录</span><span style="flex-grow: 1; height: 1px; background: #EFEFEF"></span></div>
<div style="display: flex; gap: 48px"><button aria-label="微信" style="display: flex; flex-direction: column; align-items: center; gap: 6px; border: none; background: transparent; font-family: inherit; cursor: pointer"><span style="width: 48px; height: 48px; border-radius: 24px; border: 1px solid #E6E6E6; display: flex; align-items: center; justify-content: center; color: #1A1A1A"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path></svg></span><span style="font-size: 12px; color: #6E6E6E">微信</span></button><button aria-label="Apple" style="display: flex; flex-direction: column; align-items: center; gap: 6px; border: none; background: transparent; font-family: inherit; cursor: pointer"><span style="width: 48px; height: 48px; border-radius: 24px; border: 1px solid #E6E6E6; display: flex; align-items: center; justify-content: center; color: #1A1A1A"><span style="font-family: 'DM Sans',sans-serif; font-size: 13px; font-weight: 600">ID</span></span><span style="font-size: 12px; color: #6E6E6E">Apple</span></button></div>
</div>
<sc-if value="{{warn}}" hint-placeholder-val="{{ false }}"><div style="align-self: center; padding: 10px 16px; border-radius: 999px; background: #1A1A1A; color: #FFFFFF; font-size: 13px">请先阅读并同意用户协议和隐私政策</div></sc-if>
<button onClick="{{toggle}}" style="display: flex; align-items: flex-start; gap: 8px; padding: 8px; border-radius: 12px; border: none; background: {{rowBg}}; font-family: inherit; text-align: left; cursor: pointer">
<span style="width: 18px; height: 18px; border-radius: 9px; border: 1.5px solid {{boxBorder}}; background: {{boxBg}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
<span style="font-size: 12px; line-height: 1.6; color: #6E6E6E">已阅读并同意<a href="m0_agreement.dc.html" style="color: #1A1A1A; text-decoration: none">《用户协议》</a>和<a href="m0_agreement.dc.html" style="color: #1A1A1A; text-decoration: none">《隐私政策》</a>，未注册手机号将自动创建账号</span>
</button></main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const agreed = !!s.agreed;
    return {
      agreed,
      notAgreed: !agreed,
      warn: !!s.warn && !agreed,
      toggle: () => this.setState({ agreed: !agreed, warn: false }),
      needAgree: () => this.setState({ warn: true }),
      boxBg: agreed ? '#1A1A1A' : 'transparent',
      boxBorder: agreed ? '#1A1A1A' : '#BDBDBD',
      rowBg: s.warn && !agreed ? '#FDF1DC' : 'transparent'
    };
  }
}
</script>
</body>
</html>
