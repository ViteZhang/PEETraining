<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>1.9 学习提醒</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#1A1A1A}a:hover{color:#1A1A1A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; display: flex; flex-direction: column; overflow: hidden; position: relative; font-family: 'Noto Sans SC','PingFang SC',sans-serif; color: #1A1A1A">
<main style="flex-grow: 1; display: flex; flex-direction: column; gap: 22px; padding: 56px 22px 28px; box-sizing: border-box; overflow: hidden">
<div style="display: flex; flex-direction: column; gap: 20px; margin-top: 12px">
<span style="width: 56px; height: 56px; border-radius: 18px; background: #E5F0FA; color: #1D4C77; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 20a2 2 0 0 0 4 0"></path></svg></span>
<div style="display: flex; flex-direction: column; gap: 8px"><h1 style="margin: 0; font-size: 26px; line-height: 1.35; font-weight: 700">每天提醒你学习</h1><p style="margin: 0; font-size: 14px; line-height: 1.65; color: #6E6E6E">坚持每天训练，比偶尔学很久更有效</p></div>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 14px; font-weight: 700">提醒时间</span>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px"><sc-for list="{{times}}" as="x" hint-placeholder-count="4"><button onClick="{{x.pick}}" style="height: 44px; border-radius: 22px; border: none; background: {{x.bg}}; color: {{x.fg}}; font-family: 'DM Sans',sans-serif; font-size: 14px; font-weight: 500; cursor: pointer">{{x.label}}</button></sc-for></div>
</div>
<div style="display: flex; flex-direction: column; border-top: 1px solid #EFEFEF">
<div style="display: flex; justify-content: space-between; align-items: center; min-height: 60px; gap: 12px"><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px">每日训练提醒</span><span style="font-size: 12px; color: #6E6E6E">在你设定的时间提醒今日训练</span></span><button aria-label="每日训练提醒" style="width: 50px; height: 30px; border-radius: 15px; border: none; background: #1A1A1A; position: relative; flex-shrink: 0"><span style="position: absolute; top: 3px; left: 23px; width: 24px; height: 24px; border-radius: 12px; background: #FFFFFF"></span></button></div>
<div style="height: 1px; background: #EFEFEF"></div>
<div style="display: flex; justify-content: space-between; align-items: center; min-height: 60px; gap: 12px"><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px">复习到期提醒</span><span style="font-size: 12px; color: #6E6E6E">有知识点快要遗忘时提醒你</span></span><button aria-label="复习到期提醒" style="width: 50px; height: 30px; border-radius: 15px; border: none; background: #1A1A1A; position: relative; flex-shrink: 0"><span style="position: absolute; top: 3px; left: 23px; width: 24px; height: 24px; border-radius: 12px; background: #FFFFFF"></span></button></div>
<div style="height: 1px; background: #EFEFEF"></div>
<div style="display: flex; justify-content: space-between; align-items: center; min-height: 60px; gap: 12px"><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px">资料解析完成通知</span><span style="font-size: 12px; color: #6E6E6E">上传的资料处理完后通知你</span></span><button aria-label="资料解析完成通知" style="width: 50px; height: 30px; border-radius: 15px; border: none; background: #1A1A1A; position: relative; flex-shrink: 0"><span style="position: absolute; top: 3px; left: 23px; width: 24px; height: 24px; border-radius: 12px; background: #FFFFFF"></span></button></div>
</div>
<div style="flex-grow: 1"></div>
<div style="display: flex; flex-direction: column; gap: 4px"><a href="m2_home.dc.html" style="display: flex; align-items: center; justify-content: center; height: 50px; border-radius: 25px; background: #1A1A1A; color: #FFFFFF; text-decoration: none; font-size: 15px; font-weight: 500">开启提醒</a><a href="m2_home.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 44px; font-size: 14px; color: #6E6E6E; text-decoration: none">暂不开启</a></div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const t = (this.state && this.state.t) || '20:00';
    return {
      times: ['07:30', '12:30', '20:00', '自定义'].map((x) => ({
        label: x,
        bg: x === t ? '#1A1A1A' : '#F7F7F5',
        fg: x === t ? '#FFFFFF' : '#1A1A1A',
        pick: () => this.setState({ t: x })
      }))
    };
  }
}
</script>
</body>
</html>
