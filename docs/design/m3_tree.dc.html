<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = (this.state && this.state.subject) || 'a';
    return {
      isA: s === 'a',
      isB: s === 'b',
      subjects: [{ id: 'a', label: '654 语言文学基础' }, { id: 'b', label: '908 作文' }].map((x) => ({
        label: x.label,
        bg: x.id === s ? '#FFFFFF' : 'transparent',
        weight: x.id === s ? '700' : '400',
        pick: () => this.setState({ subject: x.id })
      }))
    };
  }
}
</script>
