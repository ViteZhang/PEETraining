<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>1.3c 知识库生成中</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#1A1A1A}a:hover{color:#1A1A1A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; display: flex; flex-direction: column; overflow: hidden; position: relative; font-family: 'Noto Sans SC','PingFang SC',sans-serif; color: #1A1A1A">
<main style="flex-grow: 1; display: flex; flex-direction: column; gap: 16px; padding: 52px 22px 24px; box-sizing: border-box; overflow: hidden">
<div style="display: flex; flex-direction: column; gap: 8px"><div style="display: flex; gap: 6px"><span style="flex-grow: 1; height: 4px; border-radius: 2px; background: #1A1A1A"></span><span style="flex-grow: 1; height: 4px; border-radius: 2px; background: #1A1A1A"></span><span style="flex-grow: 1; height: 4px; border-radius: 2px; background: #1A1A1A"></span><span style="flex-grow: 1; height: 4px; border-radius: 2px; background: #EFEFEF"></span></div><span style="font-size: 12px; color: #6E6E6E">第 3 步 / 共 4 步 · 确认知识库</span></div>
<div style="display: flex; flex-direction: column; gap: 8px"><h1 style="margin: 0; font-size: 26px; line-height: 1.35; font-weight: 700">正在生成你的知识库</h1></div>
<a href="m1_framework.dc.html" style="display: flex; flex-direction: column; gap: 14px; padding: 16px 18px; border-radius: 22px; border: 1px solid #EFEFEF; text-decoration: none; color: #1A1A1A">
<div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 15px; font-weight: 700">语言学与文学理论</span><span style="font-family: 'DM Sans',sans-serif; font-size: 20px; font-weight: 600">64%</span></div>
<div style="height: 6px; background: #EFEFEF; border-radius: 3px"><div style="width: 64%; height: 6px; background: #6FA8DC; border-radius: 3px"></div></div>
<div style="display: flex; flex-direction: column; gap: 12px"><div style="display: flex; align-items: center; gap: 12px; font-size: 15px; color: #1A1A1A"><span style="width: 22px; height: 22px; border-radius: 11px; background: #1A1A1A; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>识别 46 页文字</div><div style="display: flex; align-items: center; gap: 12px; font-size: 15px; color: #1A1A1A"><span style="width: 22px; height: 22px; border-radius: 11px; background: #1A1A1A; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>提取知识点 · 已找到 132 个</div><div style="display: flex; align-items: center; gap: 12px; font-size: 15px; color: #6E6E6E"><span style="width: 22px; height: 22px; border-radius: 11px; border: 1.5px dashed #BDBDBD"></span>整理知识框架</div><div style="display: flex; align-items: center; gap: 12px; font-size: 15px; color: #6E6E6E"><span style="width: 22px; height: 22px; border-radius: 11px; border: 1.5px dashed #BDBDBD"></span>识别真题与考频</div></div>
<span style="font-size: 12px; color: #6E6E6E">预计还需 2 分钟 · 完成后自动进入下一步</span>
</a>
<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 14px; font-weight: 700">趁这会儿，设置一下备考节奏</span>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; background: #F7F7F5; border-radius: 14px"><sc-for list="{{stages}}" as="s" hint-placeholder-count="2"><button onClick="{{s.pick}}" style="height: 38px; border: none; border-radius: 10px; background: {{s.bg}}; font-family: inherit; font-size: 13px; font-weight: {{s.weight}}; color: #1A1A1A; cursor: pointer">{{s.label}}</button></sc-for></div>
<span style="font-size: 12px; color: #6E6E6E">每天大概能学多久？</span>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px"><sc-for list="{{mins}}" as="m" hint-placeholder-count="4"><button onClick="{{m.pick}}" style="height: 40px; border-radius: 20px; border: none; background: {{m.bg}}; color: {{m.fg}}; font-family: inherit; font-size: 13px; cursor: pointer">{{m.label}}</button></sc-for></div>
</div>
<div style="flex-grow: 1"></div>
<a href="m2_home_building.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 44px; font-size: 14px; color: #6E6E6E; text-decoration: none">先进入 App，生成好了通知我</a></main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const self = this;
    const s = this.state || {};
    const stage = s.stage || 'sprint';
    const mins = s.mins || 45;
    return {
      stages: [{ id: 'sprint', l: '冲刺期 · 今年初试' }, { id: 'base', l: '基础期 · 明年初试' }].map(function (d) {
        return { label: d.l, bg: d.id === stage ? '#FFFFFF' : 'transparent', weight: d.id === stage ? '700' : '400', pick: function () { self.setState({ stage: d.id }); } };
      }),
      mins: [30, 45, 60, 90].map(function (m) {
        return { label: m + ' 分钟', bg: m === mins ? '#1A1A1A' : '#F7F7F5', fg: m === mins ? '#FFFFFF' : '#1A1A1A', pick: function () { self.setState({ mins: m }); } };
      })
    };
  }
}
</script>
</body>
</html>
